<section class="experience-shell">
  <div class="experience-hero">
    <p>SIGNUP</p>
    <h1>Create your style account</h1>
    <span>Join the studio for faster checkout, saved looks, and order tracking.</span>
  </div>

  <div class="experience-card">
    <div class="form-grid">
      <label>
        <span>Email</span>
        <input placeholder="you@example.com" />
      </label>
      <label>
        <span>Name / Reference</span>
        <input placeholder="Enter details" />
      </label>
      <label class="wide">
        <span>Notes</span>
        <textarea placeholder="Add delivery, account, or admin details"></textarea>
      </label>
    </div>
    <div class="highlight-row">
      <span *ngFor="let item of highlights">{{ item }}</span>
    </div>
    <button class="primary-action">Create Account</button>
  </div>
</section>
